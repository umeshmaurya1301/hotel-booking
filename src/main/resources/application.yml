spring:
  application:
    name: hotel-booking

  threads:
    virtual:
      # Backs WebhookDispatcher's @Async outbound delivery (design doc 12.4) - backpressure,
      # not thread conservation, is the justification, matching this project's existing
      # @ConcurrencyLimit reasoning elsewhere.
      enabled: true

  datasource:
    # LOCK_TIMEOUT: how long a statement waits for a row lock before giving up. The
    # reservation path deliberately contends on the same room-night row, so contenders must
    # queue rather than fail instantly; a bounded retry (see booking.retry) covers whatever
    # still times out under heavy contention.
    url: jdbc:h2:mem:hotelbooking;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # Schema is generated from the entity annotations - they are the single source of
    # truth for constraints and indexes (see design doc 13.2/13.3). The hand-written
    # MySQL DDL in the design document is a reference artefact, not the live schema.
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

inventory:
  # Nights of inventory materialised ahead at onboarding time (design doc 4.2).
  horizon-days: 90
  default-pricing-strategy: FLAT
  lock:
    # The in-JVM lock of design doc 5.2.4 layer 1. A throughput optimisation that serialises
    # same-key contenders before they reach the database, NOT the correctness mechanism -
    # that is the atomic conditional UPDATE plus the check constraint. Turning this off must
    # not allow an overbooking, and a test asserts exactly that.
    enabled: true
    timeout: 2s

booking:
  # How long a created booking holds its rooms before the sweeper releases them (4.4).
  hold-ttl: 15m
  sweeper:
    enabled: true
    fixed-delay: 60s
  retry:
    # Bounded retry on genuine lock timeouts / deadlocks (5.3, secondary defence). Total
    # ordering on (roomTypeId, stayDate) is what prevents deadlock; this covers the case
    # where some other statement still interleaves badly.
    max-attempts: 3
    initial-delay: 25ms
    max-delay: 250ms

payment:
  gateway:
    # Below the breaker's evaluation expectations (design doc 7.3): without a timeout, a
    # hanging call never returns, the breaker never records a failure, and threads pile up.
    call-timeout: 2s
    bulkhead-limit: 5
    retry:
      max-attempts: 2
      initial-delay: 50ms
      max-delay: 300ms
  circuit-breaker:
    # One breaker, wrapping only the payment gateway call - the only unreliable remote
    # dependency (7.1). Not per-provider: bulkhead isolates providers from each other,
    # the breaker protects "the payment gateway" as a class of dependency.
    sliding-window-size: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 5s
    permitted-calls-in-half-open-state: 3
  status-check:
    # Bounded, escalating - not a fixed-interval poll (7.6.2). Configuration, not hardcoded.
    intervals: [30s, 1m, 2m, 5m, 7m, 15m, 30m, 1h]
    jitter-ratio: 0.2
    inventory-hold-window: 15m
    # Must stay longer than the cumulative time to exhaust every interval above (~3h00m30s):
    # PaymentReconciliationService checks this deadline before it checks whether the ladder
    # is exhausted (7.6.2's "presumed failure takes precedence"), so a deadline shorter than
    # or too close to that cumulative time makes MANUAL_REVIEW-via-exhaustion unreachable in
    # practice - every stuck payment would be presumed FAILED moments before the final rung
    # could fire. Found by Phase 9's StuckTransactionResolutionTest with the previous value
    # (2h, which is ~30s short) never reaching MANUAL_REVIEW; see PROJECT_STRUCTURE.txt.txt
    # 16.8 for the full account.
    auto-reversal-deadline: 210m
  idempotency:
    # How long a completed idempotency record is kept before eviction (design doc 8a) - must
    # exceed the longest plausible client retry window, which is why it is hours, not minutes.
    retention: 24h
    sweeper:
      enabled: true
      fixed-delay: 1h
  reconciliation:
    enabled: true
    fixed-delay: 15s

pricing:
  weekend:
    multiplier: 1.25
    days:
      - FRIDAY
      - SATURDAY
  seasonal:
    - label: NEW_YEAR
      from: 2026-12-20
      to: 2027-01-02
      multiplier: 1.60
    - label: DIWALI
      from: 2026-11-06
      to: 2026-11-12
      multiplier: 1.40

search:
  # An unbounded search over a large city is a denial-of-service the client did not intend.
  # No cursor paging: it is a real gap, stated rather than hidden - see design doc 10.3 / README.
  max-results: 50

api:
  # Contract version the server implements. Echoed in logs and compared against the
  # envelope's `version` for observability only - a mismatch is recorded, never rejected.
  # Rejecting on version skew would make every client upgrade a coordinated deploy.
  version: v1
  correlation-header: X-Correlation-Id
  role-header: X-Role

webhook:
  inbound:
    # +/- window on X-Timestamp before REPLAY_WINDOW_EXCEEDED (design doc 12.3 step 1).
    replay-window: 5m
  # Development placeholders only - see WebhookProperties' own Javadoc. In production these
  # come from the environment or a secret manager, never from committed YAML (design doc
  # 12.5 deliberately does not invent a key-management story beyond externalised config).
  providers:
    MOCK_CARD:
      secret: "dev-secret-card"
    MOCK_UPI:
      secret: "dev-secret-upi"
    MOCK_WALLET:
      secret: "dev-secret-wallet"
  outbound:
    # No configured merchant URL by default, so there is nothing to call - a dispatcher that
    # tried anyway would make every booking test slower and flakier for no reason.
    enabled: false
    url: ""
    secret: "dev-secret-outbound"
    retry:
      max-attempts: 4
      initial-delay: 200ms
      max-delay: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  # The console pattern itself now lives in logback-spring.xml (design doc 12.6.5) — it needs
  # a custom Logback converter for the redaction backstop, which only a logback config file
  # can register. Two sources of truth for the same pattern is how one of them goes stale.
  level:
    com.umesh.hotelbooking: INFO
