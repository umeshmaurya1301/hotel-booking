spring:
  application:
    name: hotel-booking

  datasource:
    # LOCK_TIMEOUT: how long a statement waits for a row lock before giving up. The
    # reservation path deliberately contends on the same room-night row, so contenders must
    # queue rather than fail instantly; a bounded retry (see booking.retry) covers whatever
    # still times out under heavy contention.
    url: jdbc:h2:mem:hotelbooking;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # Schema is generated from the entity annotations - they are the single source of
    # truth for constraints and indexes (see design doc 13.2/13.3). The hand-written
    # MySQL DDL in the design document is a reference artefact, not the live schema.
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

inventory:
  # Nights of inventory materialised ahead at onboarding time (design doc 4.2).
  horizon-days: 90
  default-pricing-strategy: FLAT
  lock:
    # The in-JVM lock of design doc 5.2.4 layer 1. A throughput optimisation that serialises
    # same-key contenders before they reach the database, NOT the correctness mechanism -
    # that is the atomic conditional UPDATE plus the check constraint. Turning this off must
    # not allow an overbooking, and a test asserts exactly that.
    enabled: true
    timeout: 2s

booking:
  # How long a created booking holds its rooms before the sweeper releases them (4.4).
  hold-ttl: 15m
  sweeper:
    enabled: true
    fixed-delay: 60s
  retry:
    # Bounded retry on genuine lock timeouts / deadlocks (5.3, secondary defence). Total
    # ordering on (roomTypeId, stayDate) is what prevents deadlock; this covers the case
    # where some other statement still interleaves badly.
    max-attempts: 3
    initial-delay: 25ms
    max-delay: 250ms

payment:
  gateway:
    # Below the breaker's evaluation expectations (design doc 7.3): without a timeout, a
    # hanging call never returns, the breaker never records a failure, and threads pile up.
    call-timeout: 2s
    bulkhead-limit: 5
    retry:
      max-attempts: 2
      initial-delay: 50ms
      max-delay: 300ms
  circuit-breaker:
    # One breaker, wrapping only the payment gateway call - the only unreliable remote
    # dependency (7.1). Not per-provider: bulkhead isolates providers from each other,
    # the breaker protects "the payment gateway" as a class of dependency.
    sliding-window-size: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 5s
    permitted-calls-in-half-open-state: 3
  status-check:
    # Bounded, escalating - not a fixed-interval poll (7.6.2). Configuration, not hardcoded.
    intervals: [30s, 1m, 2m, 5m, 7m, 15m, 30m, 1h]
    jitter-ratio: 0.2
    inventory-hold-window: 15m
    auto-reversal-deadline: 2h
  idempotency:
    retention: 24h
  reconciliation:
    enabled: true
    fixed-delay: 15s

pricing:
  weekend:
    multiplier: 1.25
    days:
      - FRIDAY
      - SATURDAY
  seasonal:
    - label: NEW_YEAR
      from: 2026-12-20
      to: 2027-01-02
      multiplier: 1.60
    - label: DIWALI
      from: 2026-11-06
      to: 2026-11-12
      multiplier: 1.40

api:
  # Contract version the server implements. Echoed in logs and compared against the
  # envelope's `version` for observability only - a mismatch is recorded, never rejected.
  # Rejecting on version skew would make every client upgrade a coordinated deploy.
  version: v1
  correlation-header: X-Correlation-Id
  role-header: X-Role

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.umesh.hotelbooking: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
